name: Validate XNAT Android v1.0.0

on:
  push:
    branches:
      - release/v1.0.0-reset

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify v1.0.0 baseline scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test -z "$(git diff --name-only origin/main...HEAD -- app/src/main)"
          grep -Eq "^[[:space:]]*versionName[[:space:]]+['\"]1\.0\.0['\"]" app/build.gradle
          grep -Eq "^[[:space:]]*versionCode[[:space:]]+10207" app/build.gradle
          grep -q '当前正式版本：v1.0.0' README.md
          grep -q 'XNAT Panel v1.0.0' README.md
          grep -q '不修改现有 UI 架构、页面布局、主题和主要交互方式' README.md

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Ensure Android SDK 36 is installed
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.XNAT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XNAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XNAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XNAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE_PATH="${RUNNER_TEMP}/xnat-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "XNAT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "XNAT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "XNAT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "XNAT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature and package version
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(command -v apksigner || true)"
          [ -n "$APKSIGNER" ] || APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk | tee /tmp/badging.txt
          grep -q "package: name='com.xnat.mobile' versionCode='10207' versionName='1.0.0'" /tmp/badging.txt

      - name: Prepare validation artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/XNAT-Android-v1.0.0.apk
          cd dist
          sha256sum XNAT-Android-v1.0.0.apk > XNAT-Android-v1.0.0.apk.sha256
          cat XNAT-Android-v1.0.0.apk.sha256

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: XNAT-Android-v1.0.0-validation
          path: |
            dist/XNAT-Android-v1.0.0.apk
            dist/XNAT-Android-v1.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 7
