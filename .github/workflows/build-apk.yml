name: Build XNAT Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Ensure Android SDK 36 is installed
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n 1)"

          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to read versionName from app/build.gradle" >&2
            exit 1
          fi

          if [ -z "$VERSION_CODE" ]; then
            echo "Unable to read versionCode from app/build.gradle" >&2
            exit 1
          fi

          if ! [[ "$VERSION_NAME" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid versionName for release filename: $VERSION_NAME" >&2
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo "XNAT_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "XNAT_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo "Building XNAT Android v${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.XNAT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XNAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XNAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XNAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          KEYSTORE_PATH="${RUNNER_TEMP}/xnat-release.keystore"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "XNAT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "XNAT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "XNAT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "XNAT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Remove legacy launcher resources
        shell: bash
        run: |
          set -euo pipefail

          find app/src/main/res -type f \
            \( -path '*/mipmap-*-v4/ic_launcher*' \
               -o -path '*/mipmap-*/ic_launcher.xml' \
               -o -path '*/mipmap-*/ic_launcher_round.xml' \) \
            ! -path '*/mipmap-anydpi-v26/*' \
            -print -delete

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(command -v apksigner || true)"

          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          fi

          "$APKSIGNER" verify \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Prepare release artifact
        shell: bash
        run: |
          set -euo pipefail

          APK_NAME="XNAT-Android-v${XNAT_VERSION_NAME}.apk"
          SHA_NAME="${APK_NAME}.sha256"

          rm -rf dist
          mkdir -p dist

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "dist/${APK_NAME}"

          cd dist

          sha256sum "$APK_NAME" > "$SHA_NAME"

          echo "Release files:"
          ls -lh "$APK_NAME" "$SHA_NAME"

          echo
          cat "$SHA_NAME"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: XNAT-Android-v${{ steps.app_version.outputs.version_name }}
          path: |
            dist/XNAT-Android-v${{ steps.app_version.outputs.version_name }}.apk
            dist/XNAT-Android-v${{ steps.app_version.outputs.version_name }}.apk.sha256
          if-no-files-found: error
          retention-days: 30
