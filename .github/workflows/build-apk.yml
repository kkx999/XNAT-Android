name: Build XNAT Android v1.1.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Ensure Android SDK 36 is installed
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.XNAT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XNAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XNAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XNAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          KEYSTORE_PATH="${RUNNER_TEMP}/xnat-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "XNAT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "XNAT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "XNAT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "XNAT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Remove legacy launcher resources
        shell: bash
        run: |
          set -euo pipefail
          find app/src/main/res -type f \
            \( -path '*/mipmap-*-v4/ic_launcher*' \
               -o -path '*/mipmap-*/ic_launcher.xml' \
               -o -path '*/mipmap-*/ic_launcher_round.xml' \) \
            ! -path '*/mipmap-anydpi-v26/*' \
            -print -delete

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/XNAT-Android-v1.1.0.apk
          cd dist
          sha256sum XNAT-Android-v1.1.0.apk > XNAT-Android-v1.1.0.apk.sha256

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: XNAT-Android-v1.1.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30
