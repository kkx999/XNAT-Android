name: Publish XNAT Android v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: 96064b0984c5a7237f713b743dd4737a0ffec637
      BUILD_RUN_ID: '34710476474'
      TAG: v1.0.0
      ARTIFACT_NAME: XNAT-Android-v1.0.0

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify formal release target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          git show "$TARGET_SHA:app/build.gradle" | grep -Eq "^[[:space:]]*versionName[[:space:]]+['\"]1\.0\.0['\"]"
          git show "$TARGET_SHA:app/build.gradle" | grep -Eq "^[[:space:]]*versionCode[[:space:]]+10207"
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}")"
          test "$(printf '%s' "$RUN_JSON" | jq -r .head_sha)" = "$TARGET_SHA"
          test "$(printf '%s' "$RUN_JSON" | jq -r .conclusion)" = "success"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists" >&2
            exit 1
          fi

      - name: Download verified APK artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist
          test -s dist/XNAT-Android-v1.0.0.apk
          test -s dist/XNAT-Android-v1.0.0.apk.sha256
          (cd dist && sha256sum -c XNAT-Android-v1.0.0.apk.sha256)

      - name: Publish formal release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          # XNAT Android v1.0.0

          XNAT Android 正式基线重新整理。

          - 对外版本重新从 v1.0.0 开始
          - 对接 XNAT Panel v1.0.0 / Mobile API v1
          - Application ID 保持 `com.xnat.mobile`
          - 内部 Version Code 为 `10207`，继续保持递增
          - 保留现有服务器管理、购买、订单、工单、主题和 GitHub 更新能力
          - 保留小容量 LXC 套餐规格显示与中文错误提示修复
          - 不修改现有 UI 架构、页面布局、视觉风格和主要交互逻辑

          正式 APK 已使用现有正式签名证书构建，并通过 APK 签名校验。
          EOF
          gh release create "$TAG" \
            dist/XNAT-Android-v1.0.0.apk \
            dist/XNAT-Android-v1.0.0.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "XNAT Android v1.0.0" \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Remove one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v1.0.0.yml
          git commit -m "ci: remove Android v1.0.0 publisher [skip ci]"
          git push origin HEAD:main
