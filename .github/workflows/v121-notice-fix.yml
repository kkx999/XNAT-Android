name: XNAT Android v1.2.1 notice validation

on:
  push:
    branches:
      - release/v1.2.1

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Fix error notice severity and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/xnat/mobile/MainActivity.java')
          s=p.read_text()
          old='''        boolean error = normalized.contains("失败")\n                || normalized.contains("错误")\n                || normalized.contains("不存在")\n                || normalized.contains("invalid")\n                || normalized.contains("error")\n                || normalized.contains("failed");'''
          new='''        boolean error = normalized.contains("失败")\n                || normalized.contains("错误")\n                || normalized.contains("不存在")\n                || normalized.contains("离线")\n                || normalized.contains("无法连接")\n                || normalized.contains("异常")\n                || normalized.contains("没有权限")\n                || normalized.contains("已失效")\n                || normalized.contains("过于频繁")\n                || normalized.contains("超时")\n                || normalized.contains("不允许")\n                || normalized.contains("invalid")\n                || normalized.contains("error")\n                || normalized.contains("failed");'''
          if s.count(old) != 1:
              raise SystemExit(f'error classifier baseline mismatch: {s.count(old)}')
          s=s.replace(old,new,1)
          for token in ['normalized.contains("离线")','normalized.contains("无法连接")','normalized.contains("异常")','normalized.contains("没有权限")']:
              assert token in s
          p.write_text(s)
          PY
          rm -f .github/workflows/v121-notice-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep friendly error notices visible at top"
          git push origin HEAD:release/v1.2.1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.XNAT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XNAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XNAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XNAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/xnat-release.keystore"
          test -n "$KEYSTORE_BASE64"; test -n "$KEYSTORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "XNAT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "XNAT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "XNAT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "XNAT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build release
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signature and hash
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"; fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/XNAT-Android-v1.2.1.apk
          cd dist
          sha256sum XNAT-Android-v1.2.1.apk > XNAT-Android-v1.2.1.apk.sha256
          cat XNAT-Android-v1.2.1.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: XNAT-Android-v1.2.1-final
          path: |
            dist/XNAT-Android-v1.2.1.apk
            dist/XNAT-Android-v1.2.1.apk.sha256
          if-no-files-found: error
          retention-days: 30
