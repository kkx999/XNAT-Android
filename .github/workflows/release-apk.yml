name: Release XNAT Android

on:
  push:
    branches:
      - main
    paths:
      - scripts/release-request.py

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Ensure Android SDK 36 is installed
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare requested release
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/release-request.py
          python3 scripts/release-request.py

      - name: Validate release policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle').read_text()
          assert "versionCode 10209" in gradle
          assert "versionName '1.0.2'" in gradle

          src = Path('app/src/main/java/com/xnat/mobile/MainActivity.java').read_text()
          start = src.index('    private double minimumImageDiskGb(')
          end = src.index('    private String formatDiskGb(', start)
          method = src[start:end]
          assert 'optDouble("min_disk_gb", 0)' in method
          assert 'Math.max(minimum, 3.0)' in method
          assert 'minimum > 0' in method
          assert 'images:ubuntu/' not in method
          assert 'images:debian/' not in method
          assert 'images:alpine/' not in method
          assert '"apt".equals(family)' not in method
          assert '4.0' not in method

          readme = Path('README.md').read_text()
          intro = Path('docs/INTRODUCTION.md').read_text()
          assert '当前正式版本：v1.0.2' in readme
          assert 'XNAT Android | v1.0.2' in intro
          assert 'XNAT Panel | v1.0.3' in intro
          assert 'min_disk_gb' in intro
          print('Android v1.0.2 dynamic image disk policy verified')
          PY

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.XNAT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XNAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XNAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XNAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE_PATH="${RUNNER_TEMP}/xnat-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "XNAT_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "XNAT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "XNAT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "XNAT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Remove legacy launcher resources
        shell: bash
        run: |
          set -euo pipefail
          find app/src/main/res -type f \
            \( -path '*/mipmap-*-v4/ic_launcher*' \
               -o -path '*/mipmap-*/ic_launcher.xml' \
               -o -path '*/mipmap-*/ic_launcher_round.xml' \) \
            ! -path '*/mipmap-anydpi-v26/*' \
            -print -delete

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Read app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n 1)"
          test "$VERSION_NAME" = "1.0.2"
          test "$VERSION_CODE" = "10209"
          echo "XNAT_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "XNAT_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Commit validated release state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/release-request.py
          git add app/build.gradle app/src/main/java/com/xnat/mobile/MainActivity.java README.md docs/INTRODUCTION.md
          git diff --cached --check
          git commit -m 'release: XNAT Android v1.0.2'
          git push origin HEAD:main

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="XNAT-Android-v${XNAT_VERSION_NAME}.apk"
          SHA_NAME="${APK_NAME}.sha256"
          rm -rf dist
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          (cd dist && sha256sum "$APK_NAME" > "$SHA_NAME")
          cat "dist/${SHA_NAME}"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FINAL_SHA="$(git rev-parse HEAD)"
          gh release create "v${XNAT_VERSION_NAME}" \
            "dist/XNAT-Android-v${XNAT_VERSION_NAME}.apk" \
            "dist/XNAT-Android-v${XNAT_VERSION_NAME}.apk.sha256" \
            --target "$FINAL_SHA" \
            --title "XNAT Android v${XNAT_VERSION_NAME}" \
            --notes-file "${RUNNER_TEMP}/xnat-release-notes.md"
          gh release view "v${XNAT_VERSION_NAME}" --json tagName,name,isDraft,isPrerelease,targetCommitish,url
