name: Validate XNAT Android v1.0.1

on:
  push:
    branches:
      - release/android-1.0.1

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Apply v1.0.1 patch
        run: python scripts/patch-v1.0.1.py

      - name: Release assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 10208" app/build.gradle
          grep -q "versionName '1.0.1'" app/build.gradle
          grep -q 'minimumImageDiskGb' app/src/main/java/com/xnat/mobile/MainActivity.java
          grep -q 'image-incompatible' app/src/main/java/com/xnat/mobile/MainActivity.java
          grep -q '需 ≥' app/src/main/java/com/xnat/mobile/MainActivity.java
          grep -q 'planDiskGb' app/src/main/java/com/xnat/mobile/MainActivity.java
          grep -q 'server.optDouble("disk_gb", 0)' app/src/main/java/com/xnat/mobile/MainActivity.java
          git diff --check

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/com/xnat/mobile/MainActivity.java
          if ! git diff --cached --quiet; then
            git commit -m 'feat: Android 1.0.1 image disk compatibility guard'
            git push origin HEAD:release/android-1.0.1
          fi
