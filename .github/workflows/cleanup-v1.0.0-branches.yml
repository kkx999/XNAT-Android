name: Cleanup Android v1.0.0 branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-v1.0.0-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove temporary release branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete release/v1.0.0-reset || true
          git push origin --delete release/v1.0.0-reset-work || true

      - name: Remove one-shot cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-v1.0.0-branches.yml
          git commit -m "ci: remove Android v1.0.0 branch cleanup [skip ci]"
          git push origin HEAD:main
